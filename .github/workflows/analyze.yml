name: Analizar app (rápido)

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/analyze.yml"]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.24.x", channel: stable, cache: true }
      - name: Generar plataforma y dependencias
        working-directory: app
        run: |
          flutter create . --platforms=web --org com.agenda --project-name agenda_personal
          flutter pub get
      - name: Analizar (solo errores)
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
