name: Mantener activo (Supabase + servidor)

on:
  schedule:
    - cron: "*/14 11-23,0-4 * * *"   # cada 14 min en horario activo (6:00 a 23:00 hora Colombia) para evitar cold-starts en Render y mantener Supabase activo
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /ping (consulta la base de datos y precalienta calendarios)
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          API_KEY: ${{ secrets.AGENDA_API_KEY }}
        run: |
          URL="${BACKEND_URL:-https://agenda-personal-api.onrender.com}"
          URL="${URL%/}"
          curl --fail --retry 5 --retry-delay 20 --max-time 90 \
            -H "X-API-Key: $API_KEY" \
            "$URL/ping"
