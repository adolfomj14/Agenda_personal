name: Mantener activo (Supabase + servidor)

on:
  schedule:
    - cron: "0 12 * * *"   # diario; evita que Supabase pause el proyecto por inactividad (7 días)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /ping (consulta la base de datos)
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          API_KEY: ${{ secrets.AGENDA_API_KEY }}
        run: |
          URL="${BACKEND_URL:-https://agenda-personal-api.onrender.com}"
          URL="${URL%/}"
          curl --fail --retry 5 --retry-delay 20 --max-time 90 \
            -H "X-API-Key: $API_KEY" \
            "$URL/ping"
