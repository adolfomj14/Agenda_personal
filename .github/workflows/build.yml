name: Compilar app (APK, Windows, PWA)

on:
  push:
    tags: ["v*"]          # ej.: git tag v0.1.0 && git push --tags
  workflow_dispatch:      # también manual desde la pestaña Actions

permissions:
  contents: write         # adjuntar archivos al Release
  pages: write            # publicar la PWA
  id-token: write

env:
  FLUTTER_VERSION: "3.24.x"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: Generar carpetas de plataforma
        working-directory: app
        run: flutter create . --platforms=android --org com.agenda --project-name agenda_personal
      - name: Compilar APK
        working-directory: app
        run: flutter pub get && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: agenda-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-2022   # VS 2022 fijo: windows-latest puede traer un Visual Studio que Flutter aún no soporta
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: Generar carpetas de plataforma
        working-directory: app
        run: flutter create . --platforms=windows --org com.agenda --project-name agenda_personal
      - name: Compilar Windows
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release
      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath agenda-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: agenda-windows, path: agenda-windows.zip }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - name: Generar carpetas de plataforma
        working-directory: app
        run: flutter create . --platforms=web --org com.agenda --project-name agenda_personal
      - name: Compilar PWA
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/build/web }
      - uses: actions/upload-artifact@v4
        with: { name: agenda-web, path: app/build/web }

  deploy-pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

  release:
    # Se publica aunque falle Windows o Pages; adjunta lo que sí se haya compilado.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success' }}
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agenda-android/app-release.apk
            dist/agenda-windows/agenda-windows.zip
